<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT Poster API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { max-width: 800px; width: 100%; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #888; margin-bottom: 40px; font-size: 1.1rem; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box input { flex: 1; padding: 14px 20px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; }
        .search-box input:focus { border-color: #667eea; }
        .search-box button { padding: 14px 28px; border: none; border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .search-box button:hover { opacity: 0.9; }
        .results { display: flex; flex-direction: column; gap: 16px; }
        .result-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; display: flex; gap: 20px; align-items: center; }
        .result-card img { width: 120px; height: 80px; object-fit: cover; border-radius: 8px; background: #222; }
        .result-info { flex: 1; }
        .result-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
        .result-source { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .result-url { font-size: 0.75rem; color: #667eea; word-break: break-all; margin-top: 8px; }
        .platforms { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .platform-badge { padding: 6px 14px; border-radius: 20px; background: #1a1a1a; border: 1px solid #333; font-size: 0.85rem; color: #aaa; }
        .api-info { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-top: 30px; }
        .api-info h3 { margin-bottom: 12px; color: #667eea; }
        .api-info code { background: #0a0a0a; padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; color: #e0e0e0; }
        .api-info p { margin: 8px 0; color: #aaa; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .error { text-align: center; padding: 20px; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OTT Poster API</h1>
        <p class="subtitle">Search movie/show posters from Netflix, SonyLIV, and Apple TV</p>

        <div class="platforms">
            <span class="platform-badge">Netflix</span>
            <span class="platform-badge">SonyLIV</span>
            <span class="platform-badge">Apple TV</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for a movie or show..." />
            <button onclick="search()">Search</button>
        </div>

        <div id="results" class="results"></div>

        <div class="api-info">
            <h3>API Usage</h3>
            <p>GET <code>/api/poster?q=Money+Heist</code></p>
            <p>Returns JSON with poster URLs from all platforms.</p>
            <p>Example: <code>https://your-domain.vercel.app/api/poster?q=Sacred+Games</code></p>
        </div>
    </div>

    <script>
        const input = document.getElementById('searchInput');
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') search(); });

        async function search() {
            const query = input.value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const res = await fetch(`/api/poster?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="error">No results found</div>';
                    return;
                }

                resultsDiv.innerHTML = data.results.map(r => `
                    <div class="result-card">
                        <img src="${r.poster_url}" alt="${r.title}" onerror="this.style.display='none'" />
                        <div class="result-info">
                            <div class="result-title">${r.title}</div>
                            <div class="result-source">${r.source}</div>
                            <div class="result-url">${r.poster_url}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                resultsDiv.innerHTML = '<div class="error">Error fetching results</div>';
            }
        }
    </script>
</body>
</html>
